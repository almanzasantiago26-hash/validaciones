<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- margin bottom 3 -->
<div class="container">
  <form id="miForm" novalidate>
     <div class="mb-3">
        <label for="usuario" class="form-label">usuario:</label>
        <input type="text" class="form-control" id="usuario"> 
        <span id="mensaje" class="form-text"></span>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">contraseña:</label>
        <div class="input-group">
           <input type="password" class="form-control" id="password" aria-describedby="togglePassword" maxlength="20">
           <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Mostrar contraseña">
             <!-- Ojo abierto -->
             <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:inline-block">
               <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
               <circle cx="12" cy="12" r="3" stroke-width="1.6"/>
             </svg>
             <!-- Ojo con línea (cerrado) -->
             <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none">
               <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
               <circle cx="12" cy="12" r="3" stroke-width="1.6"/>
               <line x1="2" y1="2" x2="22" y2="22" stroke-width="1.6" stroke-linecap="round"/>
             </svg>
           </button>
        </div>
      <span id="mensajePassword" class="form-text"></span>
      <div class="form-text"><span id="passwordCount">0</span>/<span id="passwordMax">20</span> caracteres</div>
      <div id="passwordWarning" class="form-text text-danger" style="display:none"></div>
    </div>
    <button type="submit" class="btn btn-success">Enviar</button>
    <div id="formMessage" class="mt-3"></div>
  </form>
</div>
<script src="validacion.js"></script>
